_format_version: "3.0"
_transform: true




services:




  - name: auth-service
    url: http://auth-service:3001
    retries: 3
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    tags: ["v1", "auth", "prod"]
    routes:
      - name: auth-public
        paths:
          - /api/v1/auth/register
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/forgot-password
          - /api/v1/auth/reset-password
        strip_path: false
        methods: [POST]
        protocols: [https]
        tags: ["public"]

      - name: auth-jwks
        paths:
          - /.well-known/jwks.json
        strip_path: false
        methods: [GET]
        protocols: [https]

      - name: auth-protected
        paths:
          - /api/v1/auth/me
          - /api/v1/auth/logout
          - /api/v1/auth/change-password
          - /api/v1/users
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE]
        protocols: [https]
        tags: ["protected"]
    plugins:
      - name: rate-limiting
        route: auth-public
        config:
          minute: 5
          hour: 30
          day: 200
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASS}
          redis_database: 5
          fault_tolerant: true




  - name: medicine-service
    url: http://medicine-service:3002
    retries: 3
    connect_timeout: 5000
    write_timeout: 30000
    read_timeout: 30000
    tags: ["v1", "medicine", "prod"]
    routes:
      - name: medicine-public-browse
        paths:
          - /api/v1/medicines
          - /api/v1/categories
          - /api/v1/search
        strip_path: false
        methods: [GET]
        protocols: [https]

      - name: medicine-admin
        paths:
          - /api/v1/admin/medicines
          - /api/v1/admin/categories
        strip_path: false
        methods: [POST, PUT, PATCH, DELETE]
        protocols: [https]
        tags: ["protected", "admin"]
    plugins:
      - name: rate-limiting
        route: medicine-public-browse
        config:
          minute: 60
          hour: 2000
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASS}
          redis_database: 5

      - name: proxy-cache
        route: medicine-public-browse
        config:
          response_code: [200]
          request_method: [GET]
          content_type: [application/json]
          cache_ttl: 300
          strategy: memory




  - name: seller-service
    url: http://seller-service:3003
    retries: 3
    connect_timeout: 5000
    tags: ["v1", "seller", "prod"]
    routes:
      - name: seller-public
        paths:
          - /api/v1/shops
        strip_path: false
        methods: [GET]
        protocols: [https]

      - name: seller-protected
        paths:
          - /api/v1/seller
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE]
        protocols: [https]




  - name: order-service
    url: http://order-service:3004
    retries: 3
    connect_timeout: 5000
    tags: ["v1", "order", "prod"]
    routes:
      - name: order-protected
        paths:
          - /api/v1/cart
          - /api/v1/orders
          - /api/v1/checkout
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE]
        protocols: [https]
    plugins:
      - name: rate-limiting
        route: order-protected
        config:
          minute: 20
          hour: 300
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASS}
          redis_database: 5




  - name: delivery-service
    url: http://delivery-service:3005
    retries: 3
    connect_timeout: 5000
    tags: ["v1", "delivery", "prod"]
    routes:
      - name: delivery-protected
        paths:
          - /api/v1/deliveries
          - /api/v1/rider
        strip_path: false
        methods: [GET, POST, PUT, PATCH, DELETE]
        protocols: [https]




  - name: report-service
    url: http://report-service:3006
    retries: 3
    connect_timeout: 5000
    read_timeout: 120000
    tags: ["v1", "report", "prod"]
    routes:
      - name: report-admin
        paths:
          - /api/v1/reports
          - /api/v1/analytics
        strip_path: false
        methods: [GET]
        protocols: [https]
        tags: ["protected", "admin"]
    plugins:
      - name: rate-limiting
        route: report-admin
        config:
          minute: 10
          hour: 100
          policy: redis
          redis_host: redis
          redis_port: 6379
          redis_password: ${REDIS_PASS}
          redis_database: 5




plugins:


  - name: cors
    config:
      origins:
        - "https://app.yourdomain.com"
        - "https://seller.yourdomain.com"
        - "https://admin.yourdomain.com"
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
      credentials: true
      max_age: 3600


  - name: rate-limiting
    config:
      minute: 30
      hour: 500
      day: 5000
      policy: redis
      redis_host: redis
      redis_port: 6379
      redis_password: ${REDIS_PASS}
      redis_database: 5
      fault_tolerant: true
      hide_client_headers: false


  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes


  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true


  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true


  - name: response-transformer
    config:
      add:
        headers:
          - "X-Frame-Options:DENY"
          - "X-Content-Type-Options:nosniff"
          - "X-XSS-Protection:1; mode=block"
          - "Referrer-Policy:strict-origin-when-cross-origin"
          - "Strict-Transport-Security:max-age=31536000; includeSubDomains; preload"
          - "Content-Security-Policy:default-src 'self'"
          - "Permissions-Policy:geolocation=(), microphone=(), camera=()"


  - name: ip-restriction
    enabled: false
    config:
      deny:
        - 0.0.0.0/0
      allow: []


  - name: bot-detection
    config:
      allow: []
      deny:
        - "(C|c)url"
        - "wget"
        - "python-requests"
