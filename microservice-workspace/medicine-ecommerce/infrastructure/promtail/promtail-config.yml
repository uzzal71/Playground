# =============================================================================
# Promtail - tails all Docker container logs and ships them to Loki
# Each container's logs become a Loki stream with labels like:
#   {container="auth-service", service="auth-service"}
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Use Docker container name as the `container` label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Add a `service` label = container name (for easier querying)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'service'
      # Capture image tag too
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      # Try to parse JSON log lines (most apps log structured JSON in prod)
      - json:
          expressions:
            level: level
            request_id: request_id
            user_id: user_id
            trace_id: trace_id
      # Promote useful fields to Loki labels
      - labels:
          level:
