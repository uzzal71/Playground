# =============================================================================
# Medicine E-commerce - MONITORING stack
# =============================================================================
# Three pillars of observability:
#   1. METRICS  - Prometheus scrapes /metrics from each service, Grafana shows
#   2. LOGS     - Promtail tails container logs, ships to Loki, Grafana shows
#   3. TRACES   - Services send OpenTelemetry traces to Jaeger
#
# Run alongside the main stack:
#   docker compose \
#     -f infrastructure/docker/docker-compose.yml \
#     -f infrastructure/docker/docker-compose.monitoring.yml \
#     up -d
#
# UIs:
#   Grafana     -> http://localhost:3000  (admin/admin on first login)
#   Prometheus  -> http://localhost:9090
#   Jaeger      -> http://localhost:16686
#   Loki        -> queried through Grafana, no UI of its own
#
# IMPORTANT: This file uses the SAME `backend` network as the main compose
# file so the monitoring stack can scrape your services.
# =============================================================================

name: medicine-ecommerce

networks:
  backend:
    external: true
    name: medicine-ecommerce_backend

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ---------------------------------------------------------------------------
  # PROMETHEUS - metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # GRAFANA - dashboards for metrics + logs + traces
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # LOKI - log aggregation (Prometheus for logs)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # PROMTAIL - tails Docker container logs and ships them to Loki
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # JAEGER - distributed tracing
  # ---------------------------------------------------------------------------
  # Services send OTLP traces to jaeger:4318 (HTTP) or jaeger:4317 (gRPC).
  # Trace ID flows: client -> gateway -> auth -> order -> rabbitmq -> delivery
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory   # use elasticsearch or cassandra for prod retention
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # NODE EXPORTER - host metrics (CPU, memory, disk, network)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # CADVISOR - per-container metrics (CPU, memory, network)
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - backend
